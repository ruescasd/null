# (Nightly cargo: per-package rustflags in a profile, see `profile.fast`
# and docs/building.md.)
cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = ["crates/worldgen", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
worldgen = { path = "crates/worldgen" }
bevy = { version = "0.19.1", features = ["experimental_pbr_pcss", "wav", "pbr_light_textures"] }

# Bevy is unusably slow without optimisation; keep our own code debuggable
# but optimise dependencies (and the hot terrain generator) fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.worldgen]
opt-level = 3

# Quick iteration: release speed, but incremental and finely split, so a
# small change rebuilds in seconds (`cargo build --profile fast`).
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256

# Our own crate without the thin local LTO across its codegen units: about
# a third of each rebuild, for no frame time we could measure (its
# dependencies keep theirs, done once; off for them too, frames were 13%
# slower). See docs/building.md.
[profile.fast.package.game]
rustflags = ["-Clto=off"]
