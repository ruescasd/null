[workspace]
resolver = "3"
members = ["crates/worldgen", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
worldgen = { path = "crates/worldgen" }
bevy = { version = "0.19.1", features = ["experimental_pbr_pcss", "wav"] }

# Bevy is unusably slow without optimisation; keep our own code debuggable
# but optimise dependencies (and the hot terrain generator) fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.worldgen]
opt-level = 3
