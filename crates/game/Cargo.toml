[package]
name = "game"
edition.workspace = true
version.workspace = true

[dependencies]
worldgen.workspace = true
bevy.workspace = true
# Boolean operations on solids (manifold3d, built from source: needs CMake
# and a C++ compiler).
manifold-csg = "0.4.1"
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
# Navigation: Recast (a Rust port) builds a navmesh from the static
# colliders, landmass finds the way across it (the versions for Bevy 0.19).
bevy_rerecast = { version = "0.5", default-features = false }
avian_rerecast = "0.6"
bevy_landmass = "0.12"
landmass_rerecast = "0.3"
landmass = "0.9"
# District ground's navigable nodes (navmesh/nodes.rs): convex hulls (geo)
# and the portals' Delaunay triangulation (spade).
geo = "0.31"
spade = "2.15"
tracing = { version = "0.1", optional = true }

[features]
# Per-system timings written as a Chrome trace (trace-*.json) on exit: build
# it apart (`CARGO_TARGET_DIR=target/profile cargo build --profile fast
# --features profile`), it recompiles Bevy.
profile = ["bevy/trace_chrome"]
# Spans longer than `SLOW_SPAN_MS` (4 ms) printed as they end, with their
# system's name (see slowspans.rs): for rare hitches. Built apart like
# `profile` (`CARGO_TARGET_DIR=target/profile ... --features slowspans`).
slowspans = ["bevy/trace", "bevy/debug", "dep:tracing"]

# (The navigation nodes' build threads set below the game's: see
# navmesh/nodes.rs, `background`. Already in the build, through Bevy.)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }
